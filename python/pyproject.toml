[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "browserctrl"
version = "2.3.0"
description = "Python client for browserctrl, which drives Chromium browsers over CDP. Needs Node 22+ and the npm package."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["browser", "automation", "cdp", "chromium", "agents"]

[project.urls]
Homepage = "https://github.com/seahyc/browserctrl"

[tool.setuptools]
packages = ["browserctrl", "chrome_cdp"]

[tool.setuptools.package-data]
browserctrl = ["HELPERS.md"]
