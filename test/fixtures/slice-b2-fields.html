<!doctype html>
<html><head><meta charset="utf-8"><title>Vehicle</title>
<style>.ph { position: absolute; color: #888; pointer-events: none; } .wrap { position: relative; }</style>
</head><body>
<h2>Add Vehicle</h2>
<!-- react-select: a bare input, its hint a separate element it is described by, its label a sibling div -->
<div class="field">
  <div class="label">Make and Model</div>
  <div class="control"><div class="wrap">
    <div class="ph" id="rs-ph">Type to Search</div>
    <input id="rs-input" role="combobox" aria-autocomplete="list" aria-describedby="rs-ph" type="text" value="">
  </div></div>
  <div class="help">Example: Honda Civic</div>
</div>
<!-- two bare fields in one row: the row's text belongs to neither -->
<div class="pair"><span>Plate and state</span> <input id="p1" type="text"> <input id="p2" type="text"></div>
<button type="button">Add Vehicle</button>
</body></html>
