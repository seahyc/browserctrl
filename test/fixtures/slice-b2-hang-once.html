<!doctype html>
<html><head><meta charset="utf-8"><title>Hangs once</title></head><body>
<p>Loaded.</p>
<script>
  // The first load wedges its main thread a moment after loading; later loads are fine.
  if (!localStorage.getItem('hungOnce')) {
    localStorage.setItem('hungOnce', '1');
    setTimeout(function () { for (;;) {} }, 300);
  }
</script>
</body></html>
