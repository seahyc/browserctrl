<!doctype html>
<html><head><meta charset="utf-8"><title>Covered form</title>
<style>body { font: 14px sans-serif; margin: 0; } header { height: 60px; padding: 10px; } form { padding: 10px; } label { display: block; margin: 8px 0; }
iframe { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - 80px); border: 0; z-index: 99; }</style></head>
<body>
<header><input type="search" placeholder="Search"></header>
<form>
  <label>Recipient name <input></label>
  <label>Recipient email <input type="email"></label>
  <label>Confirm email <input type="email"></label>
  <label>Your name <input></label>
  <label>Message <textarea></textarea></label>
  <button type="button">Add To Bag</button>
</form>
<iframe srcdoc="<p style='font:20px sans-serif;background:#fee;height:100%;margin:0;padding:20px'>Get 15% off! Sign up for texts.</p>"></iframe>
</body></html>
