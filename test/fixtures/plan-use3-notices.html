<!doctype html><title>Heavy local results</title><style>li {height:80px} dialog{width:360px}</style><h1>Local results</h1><button id="notice" onclick="document.querySelector('#messages').hidden=false">Show notices</button><button onclick="document.querySelector('dialog').showModal()">Open dialog</button><div hidden id="messages"><div role="status">Volume 0%</div><div role="status">Loading ad</div><div role="status">0 seconds of 33 seconds</div><div role="status">6</div><div role="status">OK</div><div role="status">We expanded your search area to show more results.</div><div role="status">Added to bag</div></div><dialog aria-labelledby="offer"><p>Member offer</p><h2 id="offer">Travel more. Save more.</h2><p>Join our club for savings</p><button onclick="this.closest('dialog').close()">Close</button></dialog><main><ul id="results"></ul></main><script>results.innerHTML=Array.from({length:900},(_,i)=>`<li><a href="?item=${i}"><h2>Local result number ${i}</h2></a>${Array.from({length:12},(_,j)=>`<span>Detail ${j} for result ${i} </span>`).join('')}</li>`).join('')</script>
