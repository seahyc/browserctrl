<!doctype html><html><head><meta charset="utf-8"><title>Results</title></head><body><main>
<h1 id="h"></h1>
<ul id="list" style="list-style:none;padding:0"></ul>
<nav id="pager"></nav>
</main>
<script>
const p = Number(new URLSearchParams(location.search).get('p') || 1);
document.title = `Results page ${p}`;
document.getElementById('h').textContent = `Page ${p} of 3`;
// The featured listing repeats on every page: collecting must keep it once.
const rows = [{ id: 'featured', t: 'Featured: Aeron Remastered · S$1,200' }];
for (let i = 1; i <= 3; i++) { const n = (p - 1) * 3 + i; rows.push({ id: `c${n}`, t: `Chair ${n} · S$${100 + n * 10}` }); }
document.getElementById('list').innerHTML = rows.map(r => `<li style="height:40px"><a href="/item/${r.id}">${r.t}</a></li>`).join('');
if (p < 3) document.getElementById('pager').innerHTML = `<a href="steps-pages.html?p=${p + 1}">Next</a>`;
</script></body></html>
