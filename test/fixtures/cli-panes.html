<!doctype html>
<html><head><meta charset="utf-8"><title>Console settings</title>
<style>
  body { font: 13px sans-serif; margin: 20px; }
  #log { height: 120px; overflow: auto; border: 1px solid #999; width: 400px; }
  .grid .row, .grid .head { display: flex; gap: 8px; }
  .grid .row > div, .grid .head > div { width: 140px; }
</style></head>
<body>
<header><a href="#">Console home</a></header>
<main>
  <h1>Settings</h1>
  <p id="status">Not saved</p>
  <label for="q">Search</label> <input id="q">
  <label for="country">Country</label>
  <select id="country"><option>Malaysia</option><option>Singapore</option><option>Thailand</option></select>
  <label><input type="checkbox" id="remember"> Remember me</label>
  <button onclick="document.getElementById('status').textContent = 'Saved'">Save</button>
  <button onclick="document.getElementById('status').textContent = 'Account deleted'">Delete account</button>
  <a href="/fixtures/export.csv" download="export.csv">Download CSV</a>

  <h2>Policy Document</h2>
  <p>Version: 1</p>
  <pre>Statement: Allow ecs:Describe*</pre>
  <h2>Grants</h2>
  <p>Granted to: ops-team</p>

  <h2>Users</h2>
  <!-- A grid drawn with divs, as admin consoles do. -->
  <div class="grid">
    <div class="head"><div>User</div><div>Role</div><div>Last login</div></div>
    <div class="body">
      <div class="row"><div>alice</div><div>Admin</div><div>2026-10-20</div></div>
      <div class="row"><div>bob</div><div>Viewer</div><div>2026-10-21</div></div>
      <div class="row"><div>carol</div><div>Editor, Billing</div><div>2026-10-22</div></div>
    </div>
  </div>

  <div id="log" aria-label="Log output"></div>
</main>
<footer>Footer text</footer>
<script>
  document.getElementById('log').innerHTML = Array.from({ length: 200 }, (_, i) => `<div>log line ${i + 1}</div>`).join('');
</script>
</body></html>
