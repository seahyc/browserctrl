<!doctype html>
<html><head><meta charset="utf-8"><title>Long list</title>
<style>body { font-family: sans-serif; margin: 20px; } .row { height: 40px; }</style></head>
<body>
<h1>Page 1</h1>
<p><button id="top">Top action</button></p>
<div id="rows"></div>
<p><a id="next" href="#page2" onclick="document.querySelector('h1').textContent='Page 2'">Next</a></p>
<script>
  var rows = document.getElementById('rows');
  for (var i = 1; i <= 120; i++) {
    var d = document.createElement('div'); d.className = 'row';
    d.innerHTML = '<a href="/item/' + i + '">Item ' + i + '</a>';
    rows.appendChild(d);
  }
</script>
</body></html>
