<!doctype html>
<html><head><meta charset="utf-8"><title>Friction 3</title>
<style>
  body { font: 14px sans-serif; margin: 20px; }
  #cal[hidden] { display: none; }
  #cal button { margin: 2px; width: 40px; height: 28px; }
  #days { display: grid; grid-template-columns: repeat(7, 46px); }
  #spacer { height: 160px; }
  #tail { height: 3000px; }
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.3); }
  #dialog { position: fixed; top: 40px; left: 40px; width: 300px; padding: 16px; background: #fff; border: 1px solid #333; }
  [hidden] { display: none !important; }
</style></head>
<body>
<!-- Airbnb: choosing a place opens the date panel by itself, so a click on "When" closes it;
     and the panel closes on any scroll, so a day must be clicked where it is. -->
<div id="spacer"></div>
<section>
  <button id="when" aria-expanded="true" aria-controls="cal" onclick="toggleCal()">When Add dates</button>
  <div id="cal" role="application" aria-label="Calendar">
    <h3>October 2026</h3>
    <div id="days"></div>
  </div>
  <p id="picked"></p>
</section>

<!-- Booking: ticking a filter reloads the list; the box is drawn unticked until the results come back. -->
<section id="filters">
  <label><input type="checkbox" id="fb" onchange="reload(this)"> Free Breakfast (42)</label>
</section>
<label><input type="checkbox" id="dead" onclick="return false"> Dead box</label>

<!-- A filters dialog that is already open: its opener sits behind the backdrop. -->
<button id="open-filters" onclick="openFilters()">Filters</button>
<div id="backdrop" hidden></div>
<div id="dialog" role="dialog" aria-modal="true" aria-label="Filters" hidden>
  <button onclick="document.getElementById('gym').hidden = false">Search all filters</button>
  <button id="gym" hidden onclick="document.getElementById('gymmed').textContent = 'gym on'">Gym</button>
  <p id="gymmed"></p>
  <button onclick="closeFilters()">Close</button>
</div>

<script>
  const days = document.getElementById('days');
  for (let d = 1; d <= 31; d++) {
    const b = document.createElement('button');
    const wd = new Date(2026, 9, d).toLocaleDateString('en-US', { weekday: 'long' });
    b.textContent = d;
    b.setAttribute('aria-label', `${d}, ${wd}, October 2026. Available. Select as check-in date.`);
    b.onclick = () => { document.getElementById('picked').textContent = `Picked October ${d}, 2026`; };
    days.appendChild(b);
  }
  addEventListener('scroll', () => { if (!document.getElementById('cal').hidden) toggleCal(); });
  function toggleCal() {
    const cal = document.getElementById('cal'), when = document.getElementById('when');
    cal.hidden = !cal.hidden;
    when.setAttribute('aria-expanded', String(!cal.hidden));
  }
  async function reload(box) {
    const want = box.checked;
    const host = document.getElementById('filters');
    // The list is replaced at once by a copy drawn unticked, and redrawn when the results arrive.
    host.innerHTML = '<label><input type="checkbox" id="fb" onchange="reload(this)"> Free Breakfast (42)</label>';
    await fetch('/delay?ms=300');
    await new Promise(res => setTimeout(res, 1200)); // the list renders after the network is quiet
    host.innerHTML = `<label><input type="checkbox" id="fb" onchange="reload(this)" ${want ? 'checked' : ''}> Free Breakfast (38)</label>`;
  }
  function openFilters() { document.getElementById('backdrop').hidden = false; document.getElementById('dialog').hidden = false; }
  function closeFilters() { document.getElementById('backdrop').hidden = true; document.getElementById('dialog').hidden = true; }
  if (location.search.includes('filters=open')) openFilters();
</script>
<div id="tail"></div>
</body></html>
