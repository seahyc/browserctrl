name: Test

# A push or PR finishes in about 5 minutes: the full suite split across four Ubuntu machines,
# and on macOS and Windows the tests that need no browser (paths, pipes, locks, shell quoting:
# what differs by OS), in seconds. Their browser tests take minutes each on those runners, so
# the full suite runs there nightly, or on demand from the Actions tab (Run workflow).
on:
  push:
    # dev is only ever fast-forwarded to main: the same commit, tested already.
    branches-ignore: [dev]
  pull_request:
  schedule:
    - cron: '0 18 * * *' # 02:00 in Singapore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.part }}
    runs-on: ${{ matrix.os }}
    env:
      DEEP: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 120 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, part: full 1/4, run: full --shard=1/4, checks: true }
          - { os: ubuntu-latest, part: full 2/4, run: full --shard=2/4 }
          - { os: ubuntu-latest, part: full 3/4, run: full --shard=3/4 }
          - { os: ubuntu-latest, part: full 4/4, run: full --shard=4/4 }
          # The macOS runner has 3 slow cores: three files at once, each with its own Chrome,
          # drove the load to 83 and crashed renderers, so it runs two.
          - { os: macos-latest, part: quick, run: quick, deep: full --test-concurrency=2 }
          - { os: windows-latest, part: quick, run: quick, deep: full }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - name: Typecheck, and check the npm package and the bundled extension copy
        if: matrix.checks
        run: |
          npm run typecheck
          npm pack --dry-run
          node scripts/sync-extension.mjs --check
      - name: Install the Python package
        run: python -m pip install ./python
      - run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Probe Windows screenshot rendering
        if: runner.os == 'Windows'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_TEST_NO_SANDBOX: "1"
        run: node --import ./test/helpers.mjs test/windows-screenshot-probe.mjs
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-screenshot-probe
          path: ${{ runner.temp }}/browserctrl-screenshot-probe
          retention-days: 3
      - name: Test Node suite against isolated headless Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_TEST_NO_SANDBOX: "1"
        run: node test/run.mjs ${{ env.DEEP == 'true' && matrix.deep || matrix.run }}
