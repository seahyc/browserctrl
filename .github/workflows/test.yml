name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Test Node suite against isolated headless Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_TEST_NO_SANDBOX: "1"
        run: node --test --test-concurrency=1 test/*.test.mjs
