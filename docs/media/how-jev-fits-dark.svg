<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="980" height="520" fill="#0d1117"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect x="24" y="24" width="290" height="150" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="40" y="52" font-size="15" font-weight="700" fill="#e6edf3">1. The agent writes a plan</text>
<text x="40" y="76" font-size="13.5" fill="#9198a1">One call, in words, the way a person</text>
<text x="40" y="96" font-size="13.5" fill="#9198a1">would say it:</text>
<text x="40" y="116" font-size="12.5" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">do 'fill &quot;Search&quot; = &quot;blazer&quot;'</text>
<text x="40" y="136" font-size="12.5" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">   'click &quot;Filter&quot;' 'click &quot;Black&quot;'</text>
<line x1="314" y1="99" x2="372" y2="99" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="372" y="24" width="584" height="368" rx="14" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="390" y="50" font-size="15" font-weight="700" fill="#e6edf3">2. browserctrl, for each step</text>
<rect x="390" y="66" width="250" height="96" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="406" y="94" font-size="15" font-weight="700" fill="#e6edf3">Read the page</text>
<text x="406" y="118" font-size="13.5" fill="#9198a1">Every control: role, name, state,</text>
<text x="406" y="138" font-size="13.5" fill="#9198a1">covered or not, in shadow roots too</text>
<line x1="640" y1="114" x2="690" y2="114" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="690" y="66" width="250" height="96" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="706" y="94" font-size="15" font-weight="700" fill="#e6edf3">Named exactly?</text>
<text x="706" y="118" font-size="13.5" fill="#9198a1">&quot;Filter&quot; = button &quot;Filter&quot;: act now.</text>
<text x="706" y="138" font-size="13.5" fill="#9198a1">About 3 steps in 4. No model at all.</text>
<line x1="815" y1="162" x2="815" y2="200" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<text x="824" y="186" font-size="12.5" fill="#9198a1">no</text>
<rect x="690" y="200" width="250" height="112" rx="12" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text x="706" y="228" font-size="15" font-weight="700" fill="#3fb950">Ask Jev</text>
<text x="706" y="252" font-size="13.5" fill="#9198a1">Text in: the page and the controls.</text>
<text x="706" y="272" font-size="13.5" fill="#9198a1">One question: which control?</text>
<text x="706" y="292" font-size="13.5" fill="#9198a1">Probabilities out, in about 0.3 s.</text>
<line x1="690" y1="256" x2="640" y2="256" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="390" y="200" width="250" height="112" rx="12" fill="#272115" stroke="#d29922" stroke-width="1.5"/>
<text x="406" y="228" font-size="15" font-weight="700" fill="#d29922">Act, or stop and say why</text>
<text x="406" y="252" font-size="13.5" fill="#9198a1">Sure: act. Unsure: act, flag it ⚠.</text>
<text x="406" y="272" font-size="13.5" fill="#9198a1">Nothing fits: stop, list candidates.</text>
<text x="406" y="292" font-size="13.5" fill="#9198a1">Buy, pay, send: only with click!</text>
<line x1="515" y1="312" x2="515" y2="330" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="390" y="330" width="550" height="50" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="406" y="358" font-size="13.5" font-weight="700" fill="#e6edf3">Check it worked: box ticked? section open? error shown?</text>
<line x1="390" y1="355" x2="314" y2="355" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="24" y="290" width="290" height="202" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="40" y="318" font-size="15" font-weight="700" fill="#e6edf3">3. One report back</text>
<text x="40" y="342" font-size="13.5" fill="#9198a1">✓ each step and what it hit</text>
<text x="40" y="362" font-size="12.5" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">changed on the page:</text>
<text x="40" y="382" font-size="12.5" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">  &quot;Results: 51&quot; → &quot;3 items&quot;</text>
<text x="40" y="402" font-size="12.5" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">  checkbox &quot;BLACK&quot;: checked</text>
<text x="40" y="422" font-size="13.5" fill="#9198a1">The agent answers from this,</text>
<text x="40" y="442" font-size="13.5" fill="#9198a1">without reading the page again.</text>
<text x="390" y="430" font-size="14" font-weight="700" fill="#e6edf3">Jev chooses; it never plans and never reads for the answer.</text>
<text x="390" y="454" font-size="13.5" fill="#9198a1">Planning, reading results and deciding when the task is done stay with the agent.</text>
<text x="390" y="476" font-size="13.5" fill="#9198a1">Handed whole tasks, Jev finished 0 of 21 runs (see "Why not let Jev drive?").</text>
</svg>